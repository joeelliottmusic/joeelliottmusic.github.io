<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Elliott — Jazz Saxophonist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0a08;
      color: #f0ebe0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    :root {
      --gold: #c8a96e;
      --cream: #f0ebe0;
      --cream-dim: rgba(240, 235, 224, 0.6);
      --cream-faint: rgba(240, 235, 224, 0.3);
      --line: rgba(240, 235, 224, 0.1);
    }

    nav {
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--line);
    }

    .nav-name {
      font-family: Georgia, 'Book Antiqua', serif;
      letter-spacing: 0.18em;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--cream);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cream-faint);
    }

    .nav-links a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--gold); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 48px;
      gap: 20px;
    }

    .uc-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .uc-rule {
      width: 36px;
      height: 0.5px;
      background: var(--gold);
    }

    .uc-text {
      font-family: Georgia, 'Book Antiqua', serif;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: normal;
      letter-spacing: 0.02em;
      color: var(--cream);
    }

    .uc-sub {
      font-size: 12px;
      color: var(--cream-faint);
      letter-spacing: 0.08em;
    }

    .uc-back {
      margin-top: 24px;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--gold);
      border-bottom: 0.5px solid var(--gold);
      padding-bottom: 3px;
      transition: opacity 0.2s;
    }

    .uc-back:hover { opacity: 0.7; }

    footer {
      padding: 20px 48px;
      border-top: 0.5px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-social {
      display: flex;
      gap: 20px;
      list-style: none;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cream-faint);
    }

    .footer-social a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-social a:hover { color: var(--gold); }

    .footer-location {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: rgba(240, 235, 224, 0.2);
    }

    @media (max-width: 640px) {
      nav, footer { padding: 20px 24px; }
      main { padding: 48px 24px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-name">Joe Elliott</a>
    <ul class="nav-links">
      <li><a href="under-construction.html">About</a></li>
      <li><a href="under-construction.html">Listen</a></li>
      <li><a href="under-construction.html">Dates</a></li>
      <li><a href="index.html#contact-link">Contact</a></li>
    </ul>
  </nav>

  <main>
    <p class="uc-label">Coming Soon</p>
    <div class="uc-rule"></div>
    <h1 class="uc-text">Page Under Construction</h1>
    <p class="uc-sub">Check back soon.</p>
    <a href="index.html" class="uc-back">Back to home</a>
  </main>

  <footer>
    <ul class="footer-social">
      <li><a href="#">Instagram</a></li>
      <li><a href="#">Spotify</a></li>
      <li><a href="#">Bandcamp</a></li>
    </ul>
    <span class="footer-location">NYC/London</span>
  </footer>

</body>
</html>
